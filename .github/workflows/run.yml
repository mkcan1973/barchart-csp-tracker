name: Run Barchart CSP Tracker

on:
  schedule:
    # 15:30 UTC = 11:30am EDT / 10:30am EST - mid-morning, inside the
    # 10am-2pm ET window where bid/ask spreads are reliable (avoids the
    # open/close volatility windows). Runs every weekday; the script itself
    # checks the NYSE calendar and exits immediately on market holidays.
    - cron: "30 15 * * 1-5"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tracker
        run: python barchart_csp_tracker.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in barchart_csp_positions.json barchart_csp_summary.csv index.html barchart_csp_realized_pnl.png; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Daily run: $(date -u +%Y-%m-%d)"
          git push
