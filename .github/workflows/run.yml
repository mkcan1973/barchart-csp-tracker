name: Run Barchart CSP Tracker

on:
  schedule:
    # Back to 4 fixed times/day (the original cadence, Oct 16 - Nov 2,
    # which fired reliably for weeks). The scheduling reliability problem
    # that showed up starting Nov 3 predates every change made to this
    # file - run_log.json shows the EXACT SAME 4-time schedule firing
    # cleanly every day through Nov 2, then degrading under that same
    # unchanged config from Nov 3 on. That rules out anything in this repo
    # as the cause; it's a change on GitHub's own scheduling side.
    #
    # Two tuning attempts since then (a dense every-30-min schedule, then
    # offsetting off the exact :00/:30 marks) didn't help - if anything,
    # the hit rate got worse with more attempts/day, not better, which
    # points at GitHub deprioritizing a noisier schedule rather than
    # rewarding one. So: revert to the simple, known-good cadence instead
    # of continuing to throw more scheduled attempts at a problem that
    # isn't ours to fix. Kept the one piece that still seems reasonable -
    # :07 instead of :00/:30, since GitHub's own docs flag the exact clock
    # boundaries as the busiest moments for Actions scheduling platform-
    # wide. For anything time-sensitive, use the page's own "Update
    # screener now" button instead of waiting on cron.
    #
    # 15:07/17:07/19:07 UTC = 11:07am/1:07pm/3:07pm EDT or 10:07am/
    # 12:07pm/2:07pm EST, all within market hours in both seasons. The
    # 00:07 UTC evening run is for an end-of-day status check and to
    # settle anything expiring that day - same_day_settle_ok in main() only
    # allows that once it's past 4pm ET, so it stays safe regardless of
    # which exact minute this lands. Weekday field on that one is shifted
    # a day later (Tue-Sat) since 00:07 UTC has already rolled into the
    # next UTC calendar day while still the same US trading evening. The
    # script itself checks the NYSE calendar and no-ops on weekends/
    # holidays either way.
    - cron: "7 15 * * 1-5"
    - cron: "7 17 * * 1-5"
    - cron: "7 19 * * 1-5"
    - cron: "7 0 * * 2-6"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

# A delayed scheduled trigger, or the page's own "Update screener now"
# button firing close to a scheduled run, can still occasionally overlap -
# queue them instead of letting two runs push to the same branch at once.
concurrency:
  group: tracker-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python barchart_csp_tracker.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in barchart_csp_positions.json barchart_csp_summary.csv index.html barchart_csp_realized_pnl.png run_log.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Run: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Merge (not rebase) with -X ours: if two runs land close enough
          # together that the concurrency group above doesn't fully keep
          # them apart, a plain rebase can hit a genuine content conflict
          # on these files (seen in practice from two near-simultaneous
          # manual triggers) and abort the whole push with nothing
          # resolved. Every file here is machine-generated with nothing
          # hand-authored to carefully preserve, so on a conflicting hunk
          # just keep this run's own freshly-generated version rather than
          # fail outright.
          git pull --no-rebase -X ours origin master
          git push
