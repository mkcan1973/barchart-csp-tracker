name: Run Barchart CSP Tracker

on:
  schedule:
    # GitHub's scheduled (cron) triggers are best-effort and, in practice,
    # get delayed by hours or dropped entirely during busy periods on
    # GitHub's infrastructure - confirmed via run_log.json's own history,
    # where only 3 of 4 fixed daily cron times (15:30/17:30/19:30/00:00
    # UTC) were actually firing most days, and the ones that did were
    # landing 2+ hours late.
    #
    # First attempt at a fix used "*/30" (i.e. firing exactly on :00/:30),
    # which backfired: GitHub's own docs warn that the top of every hour
    # (and, by extension, every round half-hour) is the single busiest
    # moment for Actions scheduling across ALL of GitHub, since countless
    # other repos' crons fire at those exact same instants - confirmed
    # here too, where only 1 of ~19 expected :00/:30 slots actually fired
    # on the first day this ran. Offsetting to :07/:37 avoids that exact
    # congestion spike, per GitHub's own recommendation.
    #
    # Still every 30 minutes, same 13:00-22:00 UTC window (9:00am-6:00pm
    # EDT / 8:00am-5:00pm EST, bracketing the 9:30am-4:00pm ET session
    # with margin in both seasons, including after the close so same-day
    # settlement - same_day_settle_ok in main(), gated on now_et.hour >= 16
    # - still reliably gets a run). Any individual trigger can still be
    # delayed or dropped, but ~19 scheduled attempts instead of 4 gives
    # real redundancy. This repo is public, so Actions minutes are free -
    # no cost tradeoff to running this often. The script itself checks the
    # NYSE calendar and exits immediately on weekends/holidays, so the
    # extra attempts just no-op on non-trading days instead of wasting a
    # scrape.
    - cron: "7,37 13-22 * * 1-5"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

# Running every 30 minutes means a delayed trigger can occasionally still
# be mid-run when the next one would otherwise start - queue them instead
# of letting two runs push to the same branch at once (which the push step
# below has no retry logic for).
concurrency:
  group: tracker-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python barchart_csp_tracker.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in barchart_csp_positions.json barchart_csp_summary.csv index.html barchart_csp_realized_pnl.png run_log.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Run: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Merge (not rebase) with -X ours: if two runs land close enough
          # together that the concurrency group above doesn't fully keep
          # them apart, a plain rebase can hit a genuine content conflict
          # on these files (seen in practice from two near-simultaneous
          # manual triggers) and abort the whole push with nothing
          # resolved. Every file here is machine-generated with nothing
          # hand-authored to carefully preserve, so on a conflicting hunk
          # just keep this run's own freshly-generated version rather than
          # fail outright.
          git pull --no-rebase -X ours origin master
          git push
