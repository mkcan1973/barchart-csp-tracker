name: Run Barchart CSP Tracker

on:
  schedule:
    # Three runs per weekday, 2 hours apart, all within market hours:
    # 15:30 UTC = 11:30am EDT / 10:30am EST
    # 17:30 UTC = 1:30pm EDT / 12:30pm EST
    # 19:30 UTC = 3:30pm EDT / 2:30pm EST
    # The script itself checks the NYSE calendar and exits immediately on
    # market holidays, so all three just no-op on non-trading days.
    - cron: "30 15 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "30 19 * * 1-5"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python barchart_csp_tracker.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in barchart_csp_positions.json barchart_csp_summary.csv index.html barchart_csp_realized_pnl.png; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Run: $(date -u +%Y-%m-%dT%H:%M)Z"
          git push
