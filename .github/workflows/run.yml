name: Run Barchart CSP Tracker

on:
  # GitHub's own scheduled (cron) trigger was removed from here. It proved
  # unreliable - run_log.json showed most configured daily slots simply
  # never firing, and neither a denser schedule nor offset minutes fixed
  # it (if anything, both made the hit rate worse). Scheduling now lives
  # entirely in an external cron service (cron-job.org) that calls the
  # workflow_dispatch API below at the desired times - dispatch-triggered
  # runs aren't subject to the delay/drop behavior GitHub documents for
  # the schedule: event specifically. The token that service uses is kept
  # private in its own job config, never embedded in this repo or the
  # public page, so it won't be caught and auto-revoked by GitHub's
  # secret scanning the way a page-embedded token was (twice).
  #
  # For an ad-hoc manual run, use the Actions tab on GitHub directly
  # ("Run Barchart CSP Tracker" -> "Run workflow") rather than a button
  # on the public page - no token needed since you're already logged in,
  # and it can't be triggered by anyone else who just has the page URL.
  workflow_dispatch: {}

permissions:
  contents: write

# A delayed scheduled trigger, or the page's own "Update screener now"
# button firing close to a scheduled run, can still occasionally overlap -
# queue them instead of letting two runs push to the same branch at once.
concurrency:
  group: tracker-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python barchart_csp_tracker.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in barchart_csp_positions.json barchart_csp_summary.csv index.html barchart_csp_realized_pnl.png run_log.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --staged --quiet || git commit -m "Run: $(date -u +%Y-%m-%dT%H:%M)Z"
          # Merge (not rebase) with -X ours: if two runs land close enough
          # together that the concurrency group above doesn't fully keep
          # them apart, a plain rebase can hit a genuine content conflict
          # on these files (seen in practice from two near-simultaneous
          # manual triggers) and abort the whole push with nothing
          # resolved. Every file here is machine-generated with nothing
          # hand-authored to carefully preserve, so on a conflicting hunk
          # just keep this run's own freshly-generated version rather than
          # fail outright.
          git pull --no-rebase -X ours origin master
          git push
